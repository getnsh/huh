name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verification suites
    # Split from the build deliberately. Every suite compiles only pure
    # Foundation sources -- the correction engine, cleanup, edit distance,
    # model reply parsing and token budgeting -- so this job is meaningful on
    # any macOS image, regardless of which SDK it ships.
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          swift --version

      # Runs whatever suites scripts/test.sh knows about, rather than naming
      # them here. Listing them individually meant a suite added later was
      # silently not run.
      - name: Run all suites
        run: ./scripts/test.sh

  build:
    name: Build and sign
    # The binary runs on macOS 26, but compiling it needs the macOS 27 SDK:
    # AssetInputSequenceProvider is referenced inside an `if #available` guard,
    # and `#available` is a runtime check -- resolving the symbol still requires
    # the newer SDK. GitHub-hosted runners currently ship macOS 26, so this job
    # checks first and skips rather than reporting a failure it cannot fix.
    # It starts building for real, with no edit here, once the image updates.
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        id: sdk
        run: |
          sw_vers
          swift --version
          VERSION="$(xcrun --show-sdk-version)"
          echo "SDK $VERSION"
          MAJOR="${VERSION%%.*}"
          if [ "$MAJOR" -ge 27 ]; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
          else
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SDK $VERSION cannot compile this package; build steps skipped. Release builds are made locally. See README, Compatibility."
          fi

      - name: Build
        if: steps.sdk.outputs.usable == 'true'
        run: swift build -c release

      - name: Assemble and sign bundle
        if: steps.sdk.outputs.usable == 'true'
        run: ./scripts/build.sh release

      - name: Confirm Hardened Runtime and entitlements
        if: steps.sdk.outputs.usable == 'true'
        run: |
          APP="${TMPDIR:-/tmp/}huh-build/huh?.app"
          codesign --verify --strict --verbose=2 "$APP"
          codesign -d --verbose=2 "$APP" 2>&1 | grep -q 'runtime' \
            || { echo "Hardened Runtime flag missing"; exit 1; }
          codesign -d --entitlements - --xml "$APP" 2>/dev/null | plutil -p -
