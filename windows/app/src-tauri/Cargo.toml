[package]
name = "huh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Push-to-talk dictation and meeting transcription for Windows."
default-run = "huh"

[lib]
name = "huh_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
huh-core = { path = "../../crates/huh-core" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
# The summariser drives Qwen3 through the same ONNX Runtime the recogniser
# uses; its tokenizer needs only the regex engine, not the training extras.
ort = "2.0.0-rc.13"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cpal = "0.15"
crossbeam-channel = "0.5"
# Parakeet TDT 0.6B v3 through ONNX Runtime. `onnx` is the only engine family
# compiled in: Whisper and the remote engines are not wanted.
transcribe-rs = { version = "0.3.12", features = ["onnx"] }
# The one-time model download. Blocking and small, and on Windows it speaks TLS
# through SChannel, so a machine behind a proxy with its own root certificate
# works without configuration.
ureq = { version = "3", default-features = false, features = ["native-tls"] }
sha2 = "0.10"
# "Move to Recycle Bin" after a recording is transcribed: the Windows shell's
# own recycle, so it can be put back from the Recycle Bin.
trash = "5"

[dev-dependencies]
# Reads the WAV files the `transcribe` example is pointed at.
hound = "3.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_Globalization",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_MediaFoundation",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
] }
